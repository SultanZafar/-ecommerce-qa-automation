[pytest]
markers =
    smoke: quick smoke tests covering the main happy paths
    regression: full regression suite
    auth: signup/login tests
    listing: product listing/search/filter tests
    detail: product detail page tests
    cart: cart page tests
    checkout: checkout page tests
    orders: order history tests
    order_detail: single order detail tests
    navigation: cross-page navigation/nav-bar tests
    negative: negative / invalid-input test cases
    boundary: boundary-value test cases
    known_bug: test intentionally documents a known bug from docs/BUGS.md

addopts = -ra --strict-markers
testpaths = tests
